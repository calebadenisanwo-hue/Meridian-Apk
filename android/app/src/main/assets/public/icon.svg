<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="ambientBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#18231E" />
      <stop offset="55%" stop-color="#121815" />
      <stop offset="100%" stop-color="#0E1210" />
    </radialGradient>

    <!-- Inner Soft Nebula Glow -->
    <radialGradient id="centerNebula" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#10B981" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <!-- Glowing Rings Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="50%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Glow Filter for the Rings -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Center Core Glow -->
    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" fill="url(#ambientBg)" />

  <!-- Ambient Glow Disk -->
  <circle cx="256" cy="256" r="190" fill="url(#centerNebula)" />

  <!-- Icon Rings and Features -->
  <g filter="url(#neonGlow)">
    <!-- Outer Meridian Arc (Upper Right to Bottom) -->
    <!-- Center (256, 256), Radius 150 -->
    <path 
      d="M 245,106 A 150,150 0 1 1 245,406" 
      fill="none" 
      stroke="url(#ringGrad)" 
      stroke-width="32" 
      stroke-linecap="round" 
    />

    <!-- Inner Concentric Orbit Arc (Left Side Facing) -->
    <!-- Center (256, 256), Radius 90 -->
    <path 
      d="M 265,166 A 90,90 0 0 0 265,346" 
      fill="none" 
      stroke="#34D399" 
      stroke-width="26" 
      stroke-linecap="round" 
    />
  </g>

  <!-- Glowing Center Pulse Core -->
  <g filter="url(#coreGlow)">
    <circle cx="256" cy="256" r="32" fill="#34D399" opacity="0.6" />
    <circle cx="256" cy="256" r="22" fill="#A7F3D0" />
    <circle cx="256" cy="256" r="14" fill="#FFFFFF" />
  </g>

  <!-- 4-Point Golden Beacon Star on Outer Arc -->
  <g transform="translate(352, 178)">
    <path 
      d="M 0,-18 Q 0,0 18,0 Q 0,0 0,18 Q 0,0 -18,0 Q 0,0 0,-18 Z" 
      fill="#FDE047" 
    />
    <circle cx="0" cy="0" r="3" fill="#FFFFFF" />
  </g>
</svg>
